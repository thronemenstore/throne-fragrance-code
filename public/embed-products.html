<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Throne Fragrance Products</title>
<style>body{margin:0;font:14px Inter,Arial,sans-serif;color:#17382d;background:#fffdf8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;padding:18px}.card{border:1px solid #e4dfd3;background:#fff;padding:12px}.card img{width:100%;aspect-ratio:1;object-fit:cover}.card h3{margin:12px 0 5px;font-size:16px}.price{font-weight:700;color:#a77a16}</style>
<div id="products" class="grid">Loading products…</div>
<script>fetch('/api/products').then(r=>r.json()).then(data=>{document.querySelector('#products').innerHTML=data.products.map(p=>`<article class="card"><img src="/images/${p.image_key}.webp" alt="${p.name}"><h3>${p.name}</h3><div class="price">Rs. ${Number(p.price).toLocaleString('en-PK')}</div></article>`).join('')}).catch(()=>document.querySelector('#products').textContent='Products unavailable.');</script>
